<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //Verificar se o número é positivo/negativo/zero
        var valor = prompt("Insira um valor");
        if(valor > 0){ 
            alert(`O número ${valor} é positivo`);
        }
        else if(valor < 0){ 
            alert(`O número ${valor} é negativo`);
        }else if(valor == 0){
            alert(`zero`);
        }
        
    </script>
</head>

</html>
