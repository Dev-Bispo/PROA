<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        var quantidade_aprovada = 0
        function calcular_media() {
            var numero1 = parseInt(prompt("Insira a primeira nota: "))
            var numero2 = parseInt(prompt("Insira outro valor inteiro: "))
            
            var media = (numero1 + numero2) / 2
            return media
        }

        function home() {
            var dados = calcular_media();
            if (dados >= 9.5) {
                alert("O aluno foi aprovado")
                quantidade_aprovada += 1
            } else {
                alert("O aluno reprovou")
            }
            var confirmacao = prompt("Calcular a média de outro aluno? (S/N)")
            if (confirmacao == "S") {
                home()

            } else if(confirmacao == "N") {
                alert(quantidade_aprovada)

            }
        }

        home()






    </script>
</head>

</html>
