<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicionais</title>

    <script>
        var numero1 = parseInt(prompt("insira um valor: "))
        var numero2 = parseInt(prompt("insira um segundo valor diferente: "))
        var numero3 = parseInt(prompt("insira um terceiro valor diferente: "))
        var numero4 = parseInt(prompt("insira um quarto valor diferente: "))
        
        alert(`O primeiro valor ${numero1}`)
        alert(`O último valor ${numero4}`)  

        if(numero1 > numero2 && numero1 > numero3 && numero1 > numero4){ 
            alert(`O número ${numero1} é maior`);
        }
        else if(numero2 > numero1 && numero2 > numero3 && numero2 > numero4){ 
            alert(`O número ${numero2} é maior`);

        }else if(numero3 > numero1 && numero3 > numero2 && numero3 > numero4){
            alert(`O número ${numero3} é maior`);

        }else if(numero4 > numero1 && numero4 > numero2 && numero4 > numero3){
            alert(`O número ${numero4} é maior`);
        }

        
    </script>
</head>
