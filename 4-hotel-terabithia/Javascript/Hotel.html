<html>

<head>

	<script>
		var nomeHotel = "Novo Dia"
		alert(`Bem-vindo ao ${nomeHotel}`)
		var nomeUsuário = prompt(`Digite o seu nome`)

		for (var i = 0; i <= 3; i++) {
			var senha = prompt(`Digite a senha: `)
			if (Login(senha) !== false) {
				break
			} else {
				alert(`Senha incorreta`)

			}
		}

		function menu() {
			var escolha = parseInt(prompt('Selecione uma opção 1.) Reserva de Quartos 2.) Cadastro de Hóspedes 3.) Abastecimento de Carros 4.) Sair'));

			switch (escolha){
				case 1:
					reserva_quartos()
					break
				case 2:
					cadastro_hospedes()
					break
				case 3:
					eventos()
					break
				case 4:
					ar_condicionado()
					break
				case 5:
					cadastro_hospedes()
					break
				case 6:
					relatorio_operacionais()
					break
				case 7:
					sair()
					break
				default:
					erro()

			}
			
		
		}
		function Login(senha) {
			key = 2678
			if (senha == key) {
				alert(`Bem-vindo ao Hotel ${nomeHotel}, ${nomeUsuário}. É um imenso prazer ter você por aqui!`)
				menu()
			} else {
				return false
			}
		}
		function reserva_quartos() {
			alert(`HOTEL ${nomeHotel} - RESERVA DE QUARTOS`);
			menu();
		}

		function cadastro_hospedes() {
			alert(`HOTEL ${nomeHotel} - CADASTRO DE HÓSPEDES`);
			menu();
		}

		function abastecer_carros() {
			alert(`HOTEL ${nomeHotel} - ABASTECER`);
			menu();
		}

		function erro() {
			alert(`Por favor, informe um número entre 1 e 4`);
			menu();
		}

		function sair() {
			var confirma = confirm(`Você deseja sair?`);
			if (confirma) {
				alert(`Muito obrigado e até logo, ${nomeUsuário}.`)
				window.close();
			} else {
				menu();
			}
		}




	</script>
</head>

</html>
