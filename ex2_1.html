<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicionais</title>

    <script>
        var numero1 = prompt("insira um valor: ");
        var numero2 = prompt("insira mais um valor: ");

        // Verificar qual número é maior
        if(numero1 > numero2){ 
            alert(`O número ${numero1} é maior`);
        }
        else if(numero2 > numero1){ 
            alert(`O número ${numero2} é maior`);
        }else{
            alert(`São iguais`);
        }

        
    </script>
</head>

</html>
