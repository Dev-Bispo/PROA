<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var lista_frutas = ["Abacaxi"]
        alert(lista_frutas)
        var fruta_escolha = ""

        while (lista_frutas.length !== 0 && fruta_escolha.toUpperCase() !== "PARE") {
            fruta_escolha = prompt("Digite o nome de uma fruta para retirar da lista de compras")
            if (lista_frutas.includes(fruta_escolha.charAt(0).toUpperCase() + fruta_escolha.slice(1))) {
                var indice = lista_frutas.indexOf(fruta_escolha.charAt(0).toUpperCase() + fruta_escolha.slice(1))
                lista_frutas.splice(indice, 1)
                alert("Fruta foi retirada da lista" + lista_frutas)
                if (lista_frutas.length === 0) {
                    alert("Lista de compras finalizada")
                }
                
            } else {
                alert("Fruta indisponível no nosso mercado")
            }

        }



        alert(lista_frutas)


    </script>
</head>

</body>

</html>
