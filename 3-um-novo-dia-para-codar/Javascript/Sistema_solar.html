<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var sistema_solar = ["Mercúrio", "Vênus", "Terra", "Marte", "Júpiter", "Saturno", "Urano", "Netuno", "Plutão"]
        var escolha = prompt("Escolha um Planeta do sistema Solar")

        for(const planeta of sistema_solar){
            if(planeta.toUpperCase() === escolha.toUpperCase()){
                alert(`O Planeta ${escolha} está dentro do sistema solar`)
            }
        }
    </script>
</head>
