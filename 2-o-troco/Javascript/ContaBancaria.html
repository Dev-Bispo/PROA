<html>

<head>

	<script>
		// Produti mínimo Viável(MVP)versão mais simples de um produto com apenas os recursos essencias para funcionar e ser testado no mercado
		// Aqui criamos uma variavel global. Global significa que o elemento pode ser acessado por qualquer método. Para tornar global, utilizamos a palavra static.

		var saldo = 100.5; // Float (Número com ponto flutuante)
		var compras = ["queijo", "goiaba"];
		var nome = prompt("Digite o seu nome: ")
		/*  Função principal. */
		function inicio() {
			
			alert(`Olá ${nome} é um prazer ter você por aqui!`)
			var escolha = parseInt(prompt('Selecione uma opção 1.) Saldo 2.) Extrato 3.) Saque 4.) Depósito 5.) Transferência 6.) Sair'));


			switch (escolha) {
				case 1:

					ver_saldo();

					break
				case 2:

					ver_extrato();

					break
				case 3:

					fazer_saque();

					break
				case 4:

					fazer_deposito();

					break
				case 5:

					transferência();

					break
				case 6:
					sair();
					break
				default:
					erro()
					break
			}
			/* 
			if (escolha === 1) {
				ver_saldo();
			} else if (escolha === 2) {
				fazer_deposito();
			} else if (escolha === 3) {
				fazer_saque();
			} else if (escolha === 4) {
				sair();
			} else {
				erro();
			} */
		}


		function validacao_senha() {
			var digitado = prompt("Digite a senha: ");
			var senha = 3589;
			var confirmacao = senha == digitado ? true : false;
			console.log(confirmacao)
			return confirmacao
		}

		function transferência() {
			if (validacao_senha()) {
				var numero = prompt("Insira o número para a transferência")

				if (isNaN(numero)) {
					alert(`informe um número para realizar a transferência do valor`)
					numero = 0
				} else {
					var valor = prompt(`Insira o valor que deseja transferir para o número ${numero}`)
					compras.push[numero]
					if (valor <= saldo && valor > 0) {
						saldo -= valor
					}
					else {
						alert("Operação não autorizada");
					}

				}
			} else { transferência() }
		}

		function ver_extrato() {
			if (validacao_senha()) { alert(compras) } else { ver_extrato();}

		}
		/*  Função principal. */
		function ver_saldo() {
			if (validacao_senha()) {
				alert('Seu saldo atual é: ' + saldo);
				inicio();
			} else {
				ver_saldo()
			}

		}

		/*  Função para receber informado pelo usuário, processar e levar a uma mensagem de sucesso ou a repetição da função */
		function fazer_deposito() {
			if (validacao_senha()) {
				var deposito = parseFloat(prompt('Qual o valor para depósito?'));
				// Not a Number
				if (isNaN(deposito) || deposito === '') { // A Função isNaN checa se o valor informado é um Não-Número e retorna verdadeiro ou falso.
					alert('Por favor, informe um número:');
					fazer_deposito();
				} else if (deposito > 0) {
					saldo += deposito;
					ver_saldo();
				} else {
					alert("Operação não autorizada");
				}
			} else {
				fazer_deposito()
			}


		}

		/*  Função para receber informado pelo usuário, processar e levar a uma mensagem de sucesso ou a repetição da função */
		function fazer_saque() {
			if (validacao_senha()) {
				var saque = parseFloat(prompt('Qual o valor para saque?'));
				if (isNaN(saque) || saque === '') {
					alert('Por favor, informe um número:');
					fazer_saque();
				} else if (saque == saldo || saque > 0) {
					saldo -= saque;
					ver_saldo();
				} else {
					alert("Operação não autorizada");
					inicio()
				}
			} else {
				fazer_saque()
			}

		}

		/* Verificar se há um erro */
		function erro() {
			alert('Por favor, informe um número entre 1 a 6');
			inicio();
		}

		function sair() {
			var confirma = confirm('Você deseja sair?');
			if (confirma) {
				alert(`${nome} foi um prazer ter você por aqui!`)
				window.close();
			} else {
				inicio();
			}
		}



		inicio();
	</script>
</head>

<body>

</body>

</html>
